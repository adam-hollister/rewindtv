services:
  rewindtv:
    image: ghcr.io/adam-hollister/rewindtv:latest
    container_name: rewindtv
    restart: unless-stopped
    ports:
      - "8420:8420"
    environment:
      # Time zone for time-of-day blocks and the guide.
      TZ: America/Chicago
      # Optional: the address other devices use to reach RewindTV; used in
      # M3U/XMLTV links. Defaults to whatever host the request came in on.
      # REWINDTV_PUBLIC_URL: http://192.168.1.20:8420
      # Live TV / IPTV video: "server" (default) has Plex/Jellyfin transcode
      # every program to identical 1080p H.264; "copy" passes files through.
      # REWINDTV_IPTV_VIDEO: server
      # REWINDTV_PATH_MAP: /data/media=/media
    # Runs as uid/gid 568; make ./rewindtv writable by it (chown 568:568 rewindtv).
    # RewindTV creates data/ and markers/ inside it.
    volumes:
      - ./rewindtv:/rewindtv
      # - /path/to/media:/media:ro
