# TrueNAS SCALE (24.10 "Electric Eel" or newer)
# Apps → Discover Apps → ⋮ → Install via YAML → paste this file.
#
# Uses one dataset, important/synced/rewindtv, with the Apps permission
# preset (ACL). RewindTV runs as the apps user and creates what it needs
# inside it:
#   data/     the database (channels, profiles, guide)
#   markers/  intro/credits markers, one JSON file per show
# If your pool isn't called "important", change the host path below.
services:
  rewindtv:
    image: ghcr.io/adam-hollister/rewindtv:latest
    restart: unless-stopped
    # Optional: host networking lets Plex discover RewindTV automatically
    # (HDHomeRun discovery uses UDP broadcasts). If you enable it, remove the
    # "ports" section below. Without it, add the tuner in Plex by address.
    # network_mode: host
    ports:
      - "8420:8420"
    environment:
      TZ: America/Chicago
      # Optional: with your media folder mounted read-only (below), map the
      # path your media server uses to the path inside this container so
      # auto-detect reads files directly instead of over the network.
      # REWINDTV_PATH_MAP: /data/media=/media
      # REWINDTV_PUBLIC_URL: http://truenas.local:8420
    volumes:
      - /mnt/important/synced/rewindtv:/rewindtv
      # Optional, read-only — RewindTV never writes to your media:
      # - /mnt/tank/media:/media:ro
